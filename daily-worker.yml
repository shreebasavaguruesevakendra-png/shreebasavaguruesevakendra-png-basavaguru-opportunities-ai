name: Daily Basavaguru AI Worker

on:
  workflow_dispatch:
  schedule:
    # 8:00 AM India time is 2:30 AM UTC.
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  collect-opportunities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run worker
        run: python scripts/run_worker.py

      - name: Commit updated opportunity data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update opportunity database"
          file_pattern: data/opportunities.sqlite data/opportunities.json
